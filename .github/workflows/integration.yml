# The integration tests of market-data: the migrations, the projection constraints, live consumption during a replay
# and the switch to a rebuilt projection version on a real PostgreSQL 18 (Testcontainers, so the runner's Docker
# daemon). The shared workflow of ci-cd.yml runs lint, type check and the unit tests with coverage, and the coverage
# gate leaves out the PostgreSQL and NATS adapters, so this is the only check of the SQL that feeds the read model. Make
# "integration / integration" a required check of the pull request.
name: integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:integration
